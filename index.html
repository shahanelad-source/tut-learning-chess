<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobby Fischer Teaches Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { 
            font-family: sans-serif; 
            max-width: 500px; 
            margin: 20px auto; 
            padding: 0 15px; 
            box-sizing: border-box;
        }
        .menu-container { 
            margin-bottom: 15px; 
            padding: 12px; 
            background: #f4f4f4; 
            border-radius: 8px; 
        }
        select, button { 
            font-size: 16px; /* Prevents auto-zoom on iOS */
            padding: 10px 14px; 
            cursor: pointer; 
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        /* Responsive board wrapper */
        #board-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }
        .controls { 
            margin-top: 15px; 
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .controls button {
            width: 100%;
            margin-right: 0 !important;
        }
        .dropdown-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
            padding: 10px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }
        .dropdown-row select {
            width: 100%;
        }
        #next-btn { 
            margin-top: 15px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            width: 100%;
            padding: 12px;
            font-weight: bold;
        }
        #feedback {
            margin-top: 15px; 
            font-weight: bold; 
            min-height: 40px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <label for="exercise-menu"><strong>Jump to: </strong></label><br>
        <select id="exercise-menu" onchange="jumpToExercise()" style="width: 100%; margin-top: 5px;">
            <option>Loading...</option>
        </select>
    </div>

    <h2 id="exercise-title" style="font-size: 20px;">Loading...</h2>
    <p id="exercise-question" style="font-size: 15px; line-height: 1.4;"></p>
    
    <!-- Responsive board container -->
    <div id="board-container">
        <div id="board"></div>
    </div>

    <div id="controls" class="controls"></div>
    <div id="feedback"></div>
    
    <button id="next-btn" style="display:none;" onclick="nextExercise()">Next Exercise</button>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
