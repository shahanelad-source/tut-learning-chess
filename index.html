<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bobby Fischer Teaches Chess</title>

  <!-- Chessboard.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />

  <style>
    :root {
      --bg-paper: #fbf8f2;
      --header-bg: #f5f0e6;
      --card-bg: #f2ece0;
      --card-border: #dcd3c2;
      --text-main: #1f1b18;
      --text-muted: #5c5346;
      --board-light: #f0d9b5;
      --board-dark: #b58863;
      --board-border: #3a2e25;
      --btn-tan: #b69574;
      --btn-tan-hover: #a38261;
      --btn-sage: #6b7d76;
      --btn-sage-hover: #596963;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --error: #c62828;
      --error-bg: #ffebee;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-paper);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .frame-label {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
    }

    select {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #c9bfae;
      background: #fdfbf7;
      color: var(--text-main);
      min-width: 160px;
      max-width: 240px;
      cursor: pointer;
    }

    .solved-pill {
      background: #e6dfd1;
      border: 1px solid #cfc5b3;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .icon-btn {
      background: #e6dfd1;
      border: 1px solid #cfc5b3;
      color: var(--text-main);
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .icon-btn:hover {
      background: #dad1c0;
    }

    /* Main 2-Column Layout */
    main {
      flex: 1;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 40px;
      display: grid;
      grid-template-columns: minmax(300px, 520px) minmax(300px, 420px);
      justify-content: center;
      gap: 40px;
      align-items: start;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 16px 14px 32px;
      }
      .header-inner {
        justify-content: space-between;
      }
      .frame-label {
        display: none;
      }
      select {
        min-width: 130px;
        flex: 1;
      }
    }

    /* Left Column: Board Area */
    .board-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .board-heading {
      margin: 0 0 14px 0;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.02em;
    }

    @media (max-width: 600px) {
      .board-heading {
        font-size: 1.35rem;
        margin-bottom: 10px;
      }
    }

    .board-frame {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--board-border);
      background: var(--board-light);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      touch-action: none;
      user-select: none;
    }

    #board {
      width: 100%;
      height: 100%;
    }

    /* Remove Chessboard.js inner border so our crisp 2px outer border matches the screenshot */
    .board-b72b1 {
      border: none !important;
    }

    /* Classic Warm Tan & Brown Squares */
    .white-1e1d7 {
      background-color: var(--board-light) !important;
      color: var(--board-dark) !important;
    }

    .black-3c85d {
      background-color: var(--board-dark) !important;
      color: var(--board-light) !important;
    }

    /* Make coordinates crisp like the screenshot */
    .notation-322f9 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 600;
    }

    /* Subtle 3D drop-shadow on pieces matching your screenshot */
    #board img.piece-417db {
      filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.42));
    }

    /* Square Highlights for Tap-to-Move & Last Move */
    .highlight-selected {
      box-shadow: inset 0 0 0 4px #d97706 !important;
      background-color: rgba(245, 158, 11, 0.4) !important;
    }

    .highlight-legal {
      position: relative;
    }

    .highlight-legal::after {
      content: "";
      position: absolute;
      width: 26%;
      height: 26%;
      background: rgba(30, 27, 24, 0.35);
      border-radius: 50%;
      top: 37%;
      left: 37%;
      pointer-events: none;
    }

    .highlight-last-move {
      box-shadow: inset 0 0 0 3px rgba(46, 125, 50, 0.65) !important;
    }

    .board-subcontrols {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Right Column: Book Instruction Card */
    .tutor-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid #dfd6c3;
      border-radius: 8px;
      padding: 26px 24px 20px;
      box-shadow: 0 8px 24px rgba(60, 45, 30, 0.09);
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 44px;
    }

    @media (max-width: 860px) {
      .tutor-card {
        margin-top: 0;
        padding: 20px 18px;
      }
    }

    .chapter-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.35;
      color: var(--text-main);
      margin: 0;
    }

    .frame-subtitle {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin: -6px 0 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .solved-tag {
      font-size: 0.78rem;
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #a5d6a7;
      padding: 2px 8px;
      border-radius: 4px;
      display: none;
    }

    .solved-tag.visible {
      display: inline-block;
    }

    .prompt-text {
      font-size: 1rem;
      line-height: 1.55;
      color: var(--text-main);
      white-space: pre-line;
      margin: 0;
    }

    /* Choice Options (Book style A / B list) */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-item {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid #cfc5b3;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.96rem;
      font-weight: 500;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .option-item:hover {
      background: #ffffff;
      border-color: #9e8f77;
    }

    .option-item.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }

    .option-item.wrong {
      background: var(--error-bg);
      border-color: var(--error);
      color: var(--error);
    }

    /* Boxed Move Input Container */
    .move-input-box {
      border: 1px solid #b5ab99;
      border-radius: 6px;
      background: #f9f6f0;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .move-input-label {
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .move-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .move-input-row input {
      flex: 1;
      border: 1px solid #d5ccb9;
      background: #ffffff;
      border-radius: 4px;
      padding: 7px 10px;
      font-size: 0.92rem;
      color: var(--text-main);
      outline: none;
    }

    .move-input-row input:focus {
      border-color: #8c7a60;
    }

    .check-btn {
      background: #e2dacb;
      border: 1px solid #bfb5a2;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.88rem;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .check-btn:hover {
      background: #d5cbb8;
    }

    /* Feedback & Explanation */
    .feedback-box {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 600;
      display: none;
      line-height: 1.45;
    }

    .feedback-box.success {
      display: block;
      background: var(--success-bg);
      border: 1px solid #81c784;
      color: var(--success);
    }

    .feedback-box.error {
      display: block;
      background: var(--error-bg);
      border: 1px solid #e57373;
      color: var(--error);
    }

    .feedback-box.info {
      display: block;
      background: #e8e2d5;
      border: 1px solid #c5bba8;
      color: var(--text-main);
    }

    .explanation-box {
      background: #fbf9f4;
      border-left: 3px solid var(--btn-tan);
      padding: 10px 12px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: var(--text-main);
      display: none;
      white-space: pre-line;
    }

    .explanation-box.visible {
      display: block;
    }

    /* Full-Width Action Buttons (Hint & Show Answer) */
    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .full-btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-hint {
      background: var(--btn-tan);
    }

    .btn-hint:hover {
      background: var(--btn-tan-hover);
    }

    .btn-answer {
      background: var(--btn-sage);
    }

    .btn-answer:hover {
      background: var(--btn-sage-hover);
    }

    /* Card Footer Navigation (← Prev / Next →) */
    .card-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      margin-top: 4px;
    }

    .text-nav-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.98rem;
      font-weight: 600;
      padding: 6px 4px;
      cursor: pointer;
    }

    .text-nav-btn:hover:not(:disabled) {
      text-decoration: underline;
    }

    .text-nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <span>♟ Bobby Fischer Teaches Chess</span>
      </div>

      <div class="header-controls">
        <span class="frame-label">Frame:</span>
        <select id="exerciseSelect" aria-label="Select Frame"></select>
        <span id="progressPill" class="solved-pill">0 / 0 Solved</span>
        <button class="icon-btn" id="uploadJsonBtn" title="Load local exercises.json">📂</button>
        <button class="icon-btn" id="resetProgressBtn" title="Reset progress">↺</button>
        <input type="file" id="jsonFileInput" accept=".json" class="hidden" />
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Left Column: Heading + Crisp Board -->
    <section class="board-column" id="boardSection">
      <h1 class="board-heading" id="boardHeading">1. Interactive Board</h1>

      <div class="board-frame">
        <div id="board"></div>
      </div>

      <div class="board-subcontrols">
        <span id="turnText">White to move</span>
        <div style="display: flex; gap: 6px;">
          <button class="icon-btn" id="resetBoardBtn">Reset Position</button>
          <button class="icon-btn" id="flipBoardBtn">Flip Board</button>
        </div>
      </div>
    </section>

    <!-- Right Column: Book Instruction Card -->
    <section class="tutor-card">
      <h2 class="chapter-title" id="chapterTitle">Chapter 1 — Elements of Checkmate</h2>

      <div class="frame-subtitle">
        <span id="frameSubtitle">Frame 1</span>
        <span id="solvedBadge" class="solved-tag">✓ Solved</span>
      </div>

      <p class="prompt-text" id="promptText">Loading exercises.json...</p>

      <!-- Multiple Choice Options -->
      <div id="optionsContainer" class="options-list hidden"></div>

      <!-- Move / Text Input Box -->
      <div id="textInputContainer" class="move-input-box">
        <span class="move-input-label">Or type your move (e.g., Qxh7#)</span>
        <div class="move-input-row">
          <input type="text" id="answerInput" placeholder="" autocomplete="off" />
          <button class="check-btn" id="submitAnswerBtn">Check</button>
        </div>
      </div>

      <!-- Feedback & Book Explanation -->
      <div id="feedbackBox" class="feedback-box"></div>
      <div id="explanationBox" class="explanation-box"></div>

      <!-- Hint & Show Answer Buttons -->
      <div class="action-stack">
        <button class="full-btn btn-hint" id="hintBtn">💡 Hint</button>
        <button class="full-btn btn-answer" id="solutionBtn">👁 Show Answer</button>
      </div>

      <!-- Prev / Next Footer -->
      <div class="card-nav">
        <button class="text-nav-btn" id="prevBtn">← Prev</button>
        <button class="text-nav-btn" id="nextBtn">Next →</button>
      </div>
    </section>
  </main>

  <!-- Dependencies: jQuery, Chessboard.js, Chess.js -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    const STORAGE_KEY = 'bftc_practice_progress_v1';

    let exercises = [];
    let currentIndex = 0;
    let game = new Chess();
    let board = null;
    let selectedSquare = null;
    let currentStepIndex = 0;

    let progress = loadProgress();

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.solvedIds)) {
          return {
            currentIndex: Number(saved.currentIndex) || 0,
            solvedIds: saved.solvedIds.map(String)
          };
        }
      } catch (e) {}
      return { currentIndex: 0, solvedIds: [] };
    }

    function saveProgress() {
      progress.currentIndex = currentIndex;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      updateProgressUI();
    }

    function markSolved(exId) {
      const idStr = String(exId);
      if (!progress.solvedIds.includes(idStr)) {
        progress.solvedIds.push(idStr);
      }
      saveProgress();
      document.getElementById('solvedBadge').classList.add('visible');
      populateDropdown();
    }

    function normalizeExercise(raw, idx) {
      const corr = (raw.user_correction && typeof raw.user_correction === 'object')
        ? raw.user_correction
        : {};

      const id = raw.id ?? raw.frame ?? (idx + 1);
      const frame = raw.frame ?? raw.id ?? (idx + 1);
      const chapter = corr.chapter || raw.chapter || 'Chapter 1 — Elements of Checkmate';
      const title = corr.title || raw.title || `${frame}. Interactive Board`;
      const prompt = corr.prompt || corr.text || raw.prompt || raw.text || raw.question || 'Make the best move on the board or choose below:';
      const fen = (corr.fen ?? raw.fen ?? '').trim();
      const explanation = corr.explanation || raw.explanation || '';

      let rawSol = corr.solution ?? corr.correct ?? raw.solution ?? raw.correct ?? raw.bestMove ?? [];
      let solutions = [];
      if (Array.isArray(rawSol)) {
        solutions = rawSol.map(s => String(s).trim()).filter(Boolean);
      } else if (typeof rawSol === 'string' || typeof rawSol === 'number') {
        const str = String(rawSol).trim();
        solutions = str ? [str] : [];
      }

      let options = Array.isArray(corr.options || raw.options)
        ? (corr.options || raw.options).map(String)
        : [];

      if (options.length === 0 && solutions.length === 1) {
        const lowerSol = solutions[0].toLowerCase();
        if (lowerSol === 'yes' || lowerSol === 'no') {
          options = ['A) Yes', 'B) No'];
        }
      }

      return {
        id: String(id),
        frame,
        chapter,
        title,
        prompt,
        fen,
        solutions,
        options,
        explanation
      };
    }

    async function loadExercisesFromServer() {
      try {
        const response = await fetch(`./exercises.json?t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        initDataset(data);
      } catch (err) {
        // Fallback demo frame matching your screenshot if exercises.json isn't loaded yet
        initDataset([{
          id: "2",
          frame: 2,
          chapter: "Chapter 1 — Elements of Checkmate",
          title: "2. Interactive Board",
          fen: "7k/6pQ/8/5B2/8/8/8/4K3 w - - 0 1",
          prompt: "Can White checkmate the Black King in one move? Make the move on the board or choose below:",
          options: [
            "A) Yes, play Qxh7# (Checkmate)",
            "B) No, checkmate is not possible."
          ],
          solution: ["Qxh7#", "Yes", "A) Yes, play Qxh7# (Checkmate)"],
          explanation: "White plays Qxh7# (or Qxg7#), checkmating the Black King since the Bishop on f5 protects the Queen."
        }]);
      }
    }

    function initDataset(data) {
      const rawList = Array.isArray(data)
        ? data
        : (data.exercises || data.frames || Object.values(data));

      exercises = rawList.map((item, idx) => normalizeExercise(item, idx));
      if (!exercises.length) return;

      if (progress.currentIndex >= exercises.length || progress.currentIndex < 0) {
        progress.currentIndex = 0;
      }
      currentIndex = progress.currentIndex;

      populateDropdown();
      updateProgressUI();
      renderExercise(currentIndex);
    }

    function initBoard() {
      board = Chessboard('board', {
        draggable: true,
        position: 'start',
        showNotation: true,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      });

      window.addEventListener('resize', () => {
        if (board) board.resize();
      });

      // Tap-to-move support for mobile & desktop
      $('#board').on('click', '.square-55d63', function () {
        const square = $(this).attr('data-square');
        if (square) handleSquareTap(square);
      });
    }

    function clearHighlights() {
      selectedSquare = null;
      $('#board .square-55d63').removeClass('highlight-selected highlight-legal');
    }

    function highlightLastMove(from, to) {
      $('#board .square-55d63').removeClass('highlight-last-move');
      if (from && to) {
        $(`#board .square-${from}`).addClass('highlight-last-move');
        $(`#board .square-${to}`).addClass('highlight-last-move');
      }
    }

    function handleSquareTap(square) {
      if (game.game_over()) return;

      if (selectedSquare) {
        if (selectedSquare === square) {
          clearHighlights();
          return;
        }
        const pieceOnTarget = game.get(square);
        if (pieceOnTarget && pieceOnTarget.color === game.turn()) {
          selectPieceSquare(square);
          return;
        }
        const moveAttempt = game.move({ from: selectedSquare, to: square, promotion: 'q' });
        clearHighlights();
        if (moveAttempt) {
          board.position(game.fen());
          validateBoardMove(moveAttempt);
        }
        return;
      }

      const piece = game.get(square);
      if (piece && piece.color === game.turn()) {
        selectPieceSquare(square);
      }
    }

    function selectPieceSquare(square) {
      clearHighlights();
      selectedSquare = square;
      $(`#board .square-${square}`).addClass('highlight-selected');
      const legalMoves = game.moves({ square: square, verbose: true });
      legalMoves.forEach(m => {
        $(`#board .square-${m.to}`).addClass('highlight-legal');
      });
    }

    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
    }

    function onDrop(source, target) {
      clearHighlights();
      if (source === target) return;
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      setTimeout(() => validateBoardMove(move), 40);
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function cleanNotation(str) {
      return String(str).trim().replace(/^[a-d]\)\s*/i, '').replace(/[+#?!x=\-\s]/g, '').toLowerCase();
    }

    function isMoveMatchingTarget(moveObj, targetStr) {
      if (!targetStr) return false;
      const cleanTarget = cleanNotation(targetStr);
      const cleanSan = cleanNotation(moveObj.san);
      const uci = (moveObj.from + moveObj.to).toLowerCase();
      return cleanSan === cleanTarget || uci === cleanTarget;
    }

    function playMoveByString(moveStr) {
      const legalMoves = game.moves({ verbose: true });
      for (const m of legalMoves) {
        if (isMoveMatchingTarget(m, moveStr)) return game.move(m);
      }
      return null;
    }

    function validateBoardMove(moveObj) {
      const ex = exercises[currentIndex];
      highlightLastMove(moveObj.from, moveObj.to);
      updateTurnIndicator();

      const sols = ex.solutions;
      if (sols.length === 0) {
        if (game.in_checkmate()) {
          handleCorrect(ex, `Checkmate with ${moveObj.san}!`);
        } else {
          showFeedback('info', `Played ${moveObj.san}.`);
        }
        return;
      }

      const expected = sols[currentStepIndex] || sols[0];
      const matchesStep = isMoveMatchingTarget(moveObj, expected);
      const matchesAny = currentStepIndex === 0 && sols.some(s => isMoveMatchingTarget(moveObj, s));
      const isMateAlternative = (game.in_checkmate() && sols.some(s => s.includes('#')));

      if (matchesStep || matchesAny || isMateAlternative) {
        if (matchesStep && currentStepIndex + 1 < sols.length) {
          const reply = playMoveByString(sols[currentStepIndex + 1]);
          if (reply) {
            currentStepIndex += 2;
            showFeedback('info', `Good! Opponent replies ${reply.san}. Continue...`);
            setTimeout(() => {
              board.position(game.fen());
              highlightLastMove(reply.from, reply.to);
              updateTurnIndicator();
              if (currentStepIndex >= sols.length) {
                handleCorrect(ex, 'Correct sequence completed!');
              }
            }, 450);
            return;
          }
        }
        handleCorrect(ex, `Correct! ${moveObj.san} is the right move.`);
      } else {
        showFeedback('error', `${moveObj.san} is not the best move here. Try again!`);
        setTimeout(() => {
          game.undo();
          board.position(game.fen());
          highlightLastMove(null, null);
          updateTurnIndicator();
        }, 700);
      }
    }

    function checkTextOrOptionAnswer(userAnswer, btnElement = null) {
      const ex = exercises[currentIndex];
      const cleanUser = cleanNotation(userAnswer);

      if (ex.fen) {
        const boardMove = playMoveByString(userAnswer);
        if (boardMove) {
          board.position(game.fen());
          validateBoardMove(boardMove);
          return;
        }
      }

      const isCorrect = ex.solutions.some(sol => {
        const cleanSol = cleanNotation(sol);
        return cleanSol === cleanUser ||
               cleanUser.includes(cleanSol) ||
               sol.trim().toLowerCase() === userAnswer.trim().toLowerCase();
      });

      if (isCorrect) {
        if (btnElement) btnElement.classList.add('correct');
        handleCorrect(ex, 'Correct!');
      } else {
        if (btnElement) btnElement.classList.add('wrong');
        showFeedback('error', 'Not quite right. Try again!');
      }
    }

    function handleCorrect(ex, msg) {
      showFeedback('success', msg);
      if (ex.explanation) {
        const expBox = document.getElementById('explanationBox');
        expBox.textContent = ex.explanation;
        expBox.classList.add('visible');
      }
      markSolved(ex.id);
    }

    function renderExercise(index) {
      if (!exercises.length) return;
      currentIndex = Math.max(0, Math.min(index, exercises.length - 1));
      currentStepIndex = 0;
      clearHighlights();
      highlightLastMove(null, null);

      const ex = exercises[currentIndex];
      saveProgress();

      // Update headings to match screenshot & mockup
      const headingText = /^\d/.test(ex.title) ? ex.title : `${ex.frame}. Interactive Board`;
      document.getElementById('boardHeading').textContent = headingText;
      document.getElementById('chapterTitle').textContent = ex.chapter;
      document.getElementById('frameSubtitle').textContent = `Frame ${ex.frame}`;
      document.getElementById('promptText').textContent = ex.prompt;

      const isSolved = progress.solvedIds.includes(ex.id);
      document.getElementById('solvedBadge').classList.toggle('visible', isSolved);

      const feedbackBox = document.getElementById('feedbackBox');
      feedbackBox.className = 'feedback-box';
      feedbackBox.textContent = '';

      const expBox = document.getElementById('explanationBox');
      expBox.classList.remove('visible');
      expBox.textContent = '';

      const boardSection = document.getElementById('boardSection');
      if (ex.fen) {
        boardSection.classList.remove('hidden');
        if (!game.load(ex.fen)) {
          game.load(ex.fen + ' 0 1');
        }
        board.orientation(game.turn() === 'b' ? 'black' : 'white');
        board.position(game.fen(), false);
        setTimeout(() => board.resize(), 20);
        updateTurnIndicator();
      } else {
        boardSection.classList.add('hidden');
      }

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';
      if (ex.options && ex.options.length > 0) {
        optionsContainer.classList.remove('hidden');
        ex.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'option-item';
          const prefix = /^[A-D]\)/i.test(opt) ? '' : `${String.fromCharCode(65 + i)}) `;
          btn.textContent = prefix + opt;
          btn.onclick = () => checkTextOrOptionAnswer(opt, btn);
          optionsContainer.appendChild(btn);
        });
      } else {
        optionsContainer.classList.add('hidden');
      }

      document.getElementById('answerInput').value = '';
      document.getElementById('exerciseSelect').value = String(currentIndex);
      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === exercises.length - 1);
    }

    function updateTurnIndicator() {
      let status = game.turn() === 'w' ? 'White to move' : 'Black to move';
      if (game.in_checkmate()) status = 'Checkmate!';
      else if (game.in_check()) status += ' (Check)';
      document.getElementById('turnText').textContent = status;
    }

    function showFeedback(type, message) {
      const box = document.getElementById('feedbackBox');
      box.className = `feedback-box ${type}`;
      box.textContent = message;
    }

    function updateProgressUI() {
      const total = exercises.length;
      const solvedCount = exercises.filter(e => progress.solvedIds.includes(e.id)).length;
      document.getElementById('progressPill').textContent = `${solvedCount} / ${total} Solved`;
    }

    function populateDropdown() {
      const select = document.getElementById('exerciseSelect');
      select.innerHTML = '';
      exercises.forEach((ex, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx);
        const solvedMark = progress.solvedIds.includes(ex.id) ? ' ✓' : '';
        opt.textContent = `Frame ${ex.frame}${solvedMark}`;
        select.appendChild(opt);
      });
      select.value = String(currentIndex);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initBoard();
      loadExercisesFromServer();

      document.getElementById('exerciseSelect').addEventListener('change', (e) => {
        renderExercise(Number(e.target.value));
      });

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentIndex > 0) renderExercise(currentIndex - 1);
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentIndex + 1 < exercises.length) renderExercise(currentIndex + 1);
      });

      document.getElementById('submitAnswerBtn').addEventListener('click', () => {
        const val = document.getElementById('answerInput').value.trim();
        if (val) checkTextOrOptionAnswer(val);
      });

      document.getElementById('answerInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = e.target.value.trim();
          if (val) checkTextOrOptionAnswer(val);
        }
      });

      document.getElementById('flipBoardBtn').addEventListener('click', () => board.flip());
      document.getElementById('resetBoardBtn').addEventListener('click', () => renderExercise(currentIndex));

      document.getElementById('hintBtn').addEventListener('click', () => {
        const ex = exercises[currentIndex];
        const target = ex.solutions[currentStepIndex] || ex.solutions[0];
        if (ex.fen && target) {
          const legalMoves = game.moves({ verbose: true });
          const match = legalMoves.find(m => isMoveMatchingTarget(m, target));
          if (match) {
            selectPieceSquare(match.from);
            showFeedback('info', `Hint: Look at the piece on ${match.from.toUpperCase()}.`);
            return;
          }
        }
        showFeedback('info', target ? `Hint: Starts with "${target.charAt(0)}..."` : 'Look for checks or undefended pieces.');
      });

      document.getElementById('solutionBtn').addEventListener('click', () => {
        const ex = exercises[currentIndex];
        const solText = ex.solutions.length ? ex.solutions.join(' → ') : 'See explanation below.';
        showFeedback('info', `Answer: ${solText}`);
        if (ex.fen && ex.solutions.length) {
          const m = playMoveByString(ex.solutions[currentStepIndex] || ex.solutions[0]);
          if (m) {
            board.position(game.fen());
            highlightLastMove(m.from, m.to);
            updateTurnIndicator();
          }
        }
        if (ex.explanation) {
          const expBox = document.getElementById('explanationBox');
          expBox.textContent = ex.explanation;
          expBox.classList.add('visible');
        }
      });

      document.getElementById('uploadJsonBtn').addEventListener('click', () => {
        document.getElementById('jsonFileInput').click();
      });

      document.getElementById('jsonFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            initDataset(JSON.parse(evt.target.result));
          } catch (err) {
            alert('Invalid JSON file: ' + err.message);
          }
        };
        reader.readAsText(file);
      });

      document.getElementById('resetProgressBtn').addEventListener('click', () => {
        if (confirm('Reset your solved progress?')) {
          progress = { currentIndex: 0, solvedIds: [] };
          saveProgress();
          populateDropdown();
          renderExercise(currentIndex);
        }
      });
    });
  </script>
</body>
</html>
