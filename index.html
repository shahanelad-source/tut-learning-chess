<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobby Fischer Teaches Chess - Trainer & Builder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Stable UMD build of Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header & Navigation -->
    <header class="w-full max-w-4xl py-4 px-6 flex flex-col sm:flex-row justify-between items-center border-b border-slate-800 gap-4">
        <h1 class="text-lg font-bold text-amber-400">♟️ BOBBY FISCHER TRAINER</h1>
        
        <div class="flex items-center gap-3">
            <!-- Mode Switcher -->
            <div class="bg-slate-800 p-1 rounded border border-slate-700 flex text-xs">
                <button id="mode-trainer" onclick="switchMode('trainer')" class="px-3 py-1.5 rounded bg-amber-500 text-slate-950 font-bold transition cursor-pointer">Trainer</button>
                <button id="mode-builder" onclick="switchMode('builder')" class="px-3 py-1.5 rounded text-slate-300 hover:text-white transition cursor-pointer">FEN Builder</button>
            </div>

            <!-- Jump Dropdown -->
            <select id="exercise-select" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded px-3 py-1.5 focus:outline-none focus:border-amber-500 cursor-pointer max-w-[200px]">
                <!-- Populated dynamically -->
            </select>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6 items-start my-auto">
        
        <!-- Left Panel: Chess Board & Controls -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 flex flex-col items-center">
            <div id="board" class="w-full aspect-square grid grid-cols-8 grid-rows-8 border-4 border-slate-900 rounded-lg overflow-hidden shadow-inner"></div>
            <div class="flex justify-between w-full mt-4">
                <button id="prev-btn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-xs font-medium transition cursor-pointer">Previous</button>
                <button id="hint-btn" class="px-4 py-2 bg-amber-600/30 hover:bg-amber-600/50 text-amber-300 rounded text-xs font-medium transition cursor-pointer">Explanation</button>
                <button id="next-btn" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded text-xs font-bold transition cursor-pointer">Next</button>
            </div>
        </div>

        <!-- Right Panel: Dynamic (Trainer vs Builder) -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 flex flex-col justify-between min-h-[380px]">
            
            <!-- Trainer View -->
            <div id="trainer-panel" class="flex flex-col justify-between h-full">
                <div>
                    <span id="chapter-tag" class="text-xs font-semibold px-2.5 py-1 bg-amber-500/20 text-amber-400 rounded-full">Chapter</span>
                    <h2 id="frame-title" class="text-md font-bold mt-4 text-slate-200">Exercise</h2>
                    <p id="frame-text" class="text-slate-300 mt-3 text-sm leading-relaxed">Loading...</p>
                </div>
                <div id="options-container" class="mt-6 flex flex-col gap-2 pt-4 border-t border-slate-700"></div>
            </div>

            <!-- Builder View (Hidden by default) -->
            <div id="builder-panel" class="hidden flex flex-col justify-between h-full">
                <div>
                    <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-500/20 text-emerald-400 rounded-full">FEN Creator Game</span>
                    <h2 id="builder-title" class="text-md font-bold mt-3 text-slate-200">Frame Builder</h2>
                    <p id="builder-text" class="text-slate-300 mt-2 text-xs leading-relaxed">Type or paste the FEN string for this frame below. The board on the left will update instantly!</p>
                </div>
                
                <div class="mt-4 flex flex-col gap-3">
                    <label class="text-xs text-slate-400 font-medium">FEN String:</label>
                    <input type="text" id="fen-input" oninput="previewFen(this.value)" class="bg-slate-900 border border-slate-700 text-amber-300 text-xs rounded p-2.5 font-mono focus:outline-none focus:border-amber-500" placeholder="e.g. 6Rk/7p/8/5N/8/8/8/6K b - - 0 1">
                    
                    <button onclick="saveCurrentFen()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded text-xs transition cursor-pointer">💾 Save FEN & Next Frame</button>
                    
                    <button onclick="exportBankJson()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium rounded text-xs transition cursor-pointer">📋 Copy Updated exerciseBank.js</button>
                </div>
            </div>

        </div>

    </main>

    <!-- Scripts -->
    <script src="exerciseBank.js"></script>
    <script src="app.js"></script>
</body>
</html>
