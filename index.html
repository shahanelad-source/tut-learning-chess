<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobby Fischer Chess Lesson</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        /* Speech Bubble Tail CSS */
        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 10px 15px 10px 0;
            border-style: solid;
            border-color: transparent white transparent transparent;
        }
        /* Custom Scrollbar for options */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#302e2b] text-[#c3c3c2] font-sans h-screen flex flex-col max-w-md mx-auto relative overflow-hidden">

    <!-- Top Header -->
    <header class="flex items-center justify-between p-4 bg-[#262522]">
        <button class="text-[#c3c3c2] hover:text-white transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </button>
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-[#7fa650]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L8 6h8l-4-4zm-4 5v2h8V7H8zm-1 3v6h10v-6H7zm1.5 7h7l1.5 5H7l1.5-5z"></path></svg>
            <h1 class="text-white font-bold text-lg">BobbyFischer.com</h1>
        </div>
        <button class="text-[#c3c3c2] hover:text-white transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </header>

    <!-- Coach / Speech Bubble Area -->
    <div class="flex items-center p-4 gap-4 bg-[#302e2b]">
        <div class="w-14 h-14 bg-orange-200 rounded-full flex items-center justify-center text-3xl shrink-0 border-2 border-[#302e2b] shadow-lg">
            🧑‍🏫
        </div>
        <div class="relative bg-white text-[#333333] px-4 py-3 rounded-2xl speech-bubble font-medium text-sm shadow-md w-full">
            <span id="frame-text">Loading lesson...</span>
        </div>
    </div>

    <!-- Chess Board (Tournament Green) -->
    <div id="board-container" class="w-full aspect-square relative select-none">
        <div id="board" class="w-full h-full grid grid-cols-8 grid-rows-8"></div>
        <!-- Coordinates Overlay -->
        <div class="absolute top-0.5 left-1 text-[10px] text-[#ebecd0] font-bold">8</div>
        <div class="absolute bottom-0.5 right-1 text-[10px] text-[#ebecd0] font-bold">h</div>
    </div>

    <!-- Interactive Answer Area -->
    <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-2" id="options-container">
        <!-- Buttons injected here by JS -->
    </div>

    <!-- Bottom Navigation Bar -->
    <footer class="flex justify-around items-center bg-[#262522] py-2 mt-auto border-t border-[#1e1e1e]">
        <button onclick="document.getElementById('nav-modal').classList.remove('hidden')" class="flex flex-col items-center gap-1 text-[#8b8987] hover:text-white transition w-16">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span class="text-[10px] font-bold">Options</span>
        </button>
        <button id="btn-prev" class="flex flex-col items-center gap-1 text-[#8b8987] hover:text-white transition w-16">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1v12zm0 0v7"></path></svg>
            <span class="text-[10px] font-bold">Abort</span>
        </button>
        <button id="btn-hint" class="flex flex-col items-center gap-1 text-[#8b8987] hover:text-white transition w-16">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
            <span class="text-[10px] font-bold">Hint</span>
        </button>
        <button id="btn-next" class="flex flex-col items-center gap-1 text-[#8b8987] hover:text-white transition w-16">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
            <span class="text-[10px] font-bold">Undo</span>
        </button>
    </footer>

    <!-- Hidden Dropdown Modal for "Options" -->
    <div id="nav-modal" class="hidden absolute inset-0 bg-black/70 flex items-end z-50">
        <div class="w-full bg-[#262522] rounded-t-2xl p-4 flex flex-col gap-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-white font-bold">Jump to Frame</h3>
                <button onclick="document.getElementById('nav-modal').classList.add('hidden')" class="text-gray-400">✕</button>
            </div>
            <select id="exercise-select" class="w-full bg-[#302e2b] text-white p-3 rounded-lg border border-[#403e3b] focus:outline-none"></select>
        </div>
    </div>

    <script src="exerciseBank.js"></script>
    <script src="app.js"></script>
</body>
</html>
