<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bobby Fischer Teaches TUT Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        #board { width: 400px; margin-bottom: 20px; }
        .controls { margin-top: 15px; }
        button { padding: 8px 16px; cursor: pointer; margin-right: 10px; margin-bottom: 10px; }
        #next-btn { margin-top: 15px; background-color: #007bff; color: white; border: none; }
        .menu-container { margin-bottom: 20px; padding: 10px; background: #f4f4f4; border-radius: 5px; }
        select { padding: 5px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="menu-container">
        <label for="exercise-menu"><strong>Jump to: </strong></label>
        <select id="exercise-menu" onchange="jumpToExercise()">
            <option>Loading...</option>
        </select>
    </div>

    <h2 id="exercise-title">Loading...</h2>
    <p id="exercise-question"></p>
    
    <div id="board"></div>
    <div id="controls" class="controls"></div>
    <div id="feedback" style="margin-top: 15px; font-weight: bold; min-height: 40px;"></div>
    
    <button id="next-btn" style="display:none;" onclick="nextExercise()">Next Exercise</button>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
