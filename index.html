<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bobby Fischer Teaches Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        #board { width: 400px; margin-bottom: 20px; }
        .controls { margin-top: 15px; }
        button { padding: 8px 16px; cursor: pointer; }
        #next-btn { margin-top: 15px; background-color: #007bff; color: white; border: none; }
    </style>
</head>
<body>

    <h2 id="exercise-title"></h2>
    <p id="exercise-question"></p>
    
    <div id="board"></div>
    <div id="controls" class="controls"></div>
    <div id="feedback" style="margin-top: 15px; font-weight: bold; min-height: 40px;"></div>
    
    <button id="next-btn" style="display:none;" onclick="nextExercise()">Next Exercise</button>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
